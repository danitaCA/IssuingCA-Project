spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/pki_db
    username: pki_user
    password: pki_user123
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # <-- Fixed syntax (change temporarily to 'create' if needed)

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false

  ldap:
    repositories:
      enabled: false

pki:
  hsm:
    enabled: true
  ca:
    base-url: http://localhost:8080
  crl:
    full-interval-hours: 24
    delta-interval-hours: 1
    output-dir: ./target/crl-output
  ldap:
    enabled: false
    url: ldap://localhost:389
    bind-dn: cn=admin,dc=example,dc=com
    bind-password: changeit
    crl-dn-template: cn={caCN},ou=CRLDistributionPoints,dc=example,dc=com